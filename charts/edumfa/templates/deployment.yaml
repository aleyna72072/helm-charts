---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edumfa.fullname" . }}
  labels:
    {{- include "edumfa.labels" . | nindent 4 }}
spec:
  {{- if not .Values.edumfa.worker.autoscaling.enabled }}
  replicas: {{ .Values.edumfa.worker.replicaCount }}
  {{- end }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "edumfa.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.edumfa.worker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "edumfa.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- $env := `
- name: CONTAINER_TYPE
  value: "helm_worker"
      ` }}
      {{- $container_extra_conf := `
ports:
- name: http
  containerPort: 8000
  protocol: TCP
{{- with .Values.edumfa.worker.livenessProbe }}
livenessProbe:
  {{- toYaml . | nindent 4 }}
{{- end }}
{{- with .Values.edumfa.worker.readinessProbe }}
readinessProbe:
  {{- toYaml . | nindent 4 }}
{{- end }}
      ` }}
      {{- $spec_settings := dict "env" $env "containerExtraConf" $container_extra_conf }}
      {{- $spec_params := dict "Chart" .Chart "Values" .Values "specSettings" $spec_settings "specValues" .Values.edumfa.worker }}
      {{- include "edumfa.spec" $spec_params | nindent 6}}
