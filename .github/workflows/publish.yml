name: publish

permissions:
  contents: write

on:
  push:
    tags:
      - "edumfa-*"

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
       REGISTRY: "ghcr.io"
       REPOSITORY: "oci://${{ env.REGISTRY }}/aleyna72072/helm-charts"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.12.0
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and publish chart
        run: |
          helm package ./charts/edumfa/
          helm push edumfa*.tgz ${{ env.REPOSITORY  }}
      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: "See https://github.com/eduMFA/helm-charts/blob/main/charts/edumfa/CHANGELOG.md for the changelog."
          working_directory: ./charts/edumfa/
          files: values.yaml
